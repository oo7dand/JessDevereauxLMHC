<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jessica Devereaux, LMHC — Counseling & Wellness</title>
  <meta name="description" content="Compassionate licensed mental health counseling for adults, teens, and families." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#fbfbfb;
      --card:#ffffff;
      --muted:#6b7280;
      --accent:#1366ff;
      --radius:14px;
      --max-width:1100px;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      color:#0f172a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg, #f7f9fc 0%, var(--bg) 40%);
      padding:32px 20px;
      line-height:1.45;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{width:100%;max-width:var(--max-width);margin:0 auto;}
    header{
      display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;
    }
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
    .logo{
      width:54px;height:54px;border-radius:12px;
      background:linear-gradient(135deg,var(--accent),#4ab3ff);
      display:flex;align-items:center;justify-content:center;
      color:white;font-weight:700;font-size:18px;
      box-shadow:0 6px 18px rgba(19,102,255,0.12);
    }
    nav a{margin-left:18px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px}

    .hero{
      display:grid;grid-template-columns:1fr 420px;gap:28px;align-items:center;margin-bottom:36px;
    }
    .hero-card{
      background:var(--card);padding:28px;border-radius:var(--radius);
      box-shadow:0 6px 30px rgba(15,23,42,0.06);
    }
    .eyebrow{color:var(--accent);font-weight:700;margin-bottom:8px;font-size:13px}
    h1{margin:0 0 12px 0;font-size:28px;line-height:1.15}
